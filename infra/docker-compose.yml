# Cara termudah menyiapkan dependensi untuk reviewer yang punya Docker.
# Kalau tidak memakai Docker, lihat scripts/start-infra.ps1 (MySQL & Redis portable).
services:
  mysql:
    image: mysql:8.4
    container_name: dexa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: dexa_app
      MYSQL_PASSWORD: dexa_password
      MYSQL_DATABASE: dexa_absensi
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dexa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
