# Dipakai kedua server block: static SPA + reverse proxy ke api.

# Foto profil maks 2 MB (MAX_UPLOAD_SIZE_MB), beri sedikit ruang untuk multipart.
client_max_body_size 5m;

location /api/ {
  proxy_pass http://dexa_api;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /uploads/ {
  proxy_pass http://dexa_api;
}

# WebSocket notifikasi realtime (socket.io, namespace /notifications).
location /socket.io/ {
  proxy_pass http://dexa_api;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_read_timeout 1h;
}

# File hasil build Vite memakai hash di nama, aman di-cache lama.
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

# Fallback SPA untuk route React Router (/karyawan, /absensi, dst).
location / {
  try_files $uri /index.html;
}
